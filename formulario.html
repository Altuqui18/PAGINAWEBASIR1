    <main class="page-shell">
        <fieldset class="form-container">
            <legend>Envíanos un mensaje</legend>
            <form action="#" method="post">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="tuemail@ejemplo.com" required>
                </div>

                <div>
                    <label for="asunto">Asunto:</label>
                    <select id="asunto" name="asunto">
                        <option value="consulta">Consulta</option>
                        <option value="sugerencia">Sugerencia</option>
                        <option value="trabajo">Trabajo</option>
                    </select>
                </div>

                <div>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí tu mensaje..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar</button>
            </form>
        </fieldset>
    </main>
